{% extends "base.html" %}

{% block title %}حسابي | بيوت العراق{% endblock %}

{% block content %}

<div class="account-page">

    <div class="account-header">
        <div class="account-icon">👤</div>
        <div>
            <h1>حسابي</h1>
            <p>إدارة معلومات حسابك</p>
        </div>
    </div>

    {% if message %}
    <div class="account-success">
        {{ message }}
    </div>
    {% endif %}

    <div class="account-card">

        <div class="account-section-title">
            <span>👤</span>
            <div>
                <h2>المعلومات الشخصية</h2>
                <p>معلومات حسابك في بيوت العراق</p>
            </div>
        </div>

        <form method="POST">

            <div class="account-field">
                <label>اسم المستخدم</label>

                <input
                    type="text"
                    value="{{ user.username }}"
                    disabled
                >

                <small>اسم المستخدم لا يمكن تغييره</small>
            </div>

            <div class="account-field">
                <label>📱 رقم الهاتف</label>

                <input
                    name="phone"
                    type="tel"
                    value="{{ user.phone or '' }}"
                    placeholder="07xxxxxxxxx"
                >
            </div>

            <button type="submit" class="account-save">
                💾 حفظ التعديلات
            </button>

        </form>

    </div>

</div>

<style>

.account-page {
    max-width: 760px;
    margin: 20px auto 50px;
}

.account-header {
    display: flex;
    align-items: center;
    gap: 15px;
    background: linear-gradient(135deg, #1769aa, #0f4c75);
    color: white;
    padding: 28px 25px;
    border-radius: 20px;
    margin-bottom: 20px;
}

.account-icon {
    width: 58px;
    height: 58px;
    background: rgba(255,255,255,.15);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

.account-header h1 {
    font-size: 28px;
    margin: 0;
}

.account-header p {
    margin-top: 4px;
    opacity: .85;
}

.account-card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
}

.account-section-title {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 20px;
    margin-bottom: 20px;
    border-bottom: 1px solid #edf0f4;
}

.account-section-title > span {
    width: 45px;
    height: 45px;
    border-radius: 13px;
    background: #eef6fc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

.account-section-title h2 {
    font-size: 20px;
    margin: 0;
}

.account-section-title p {
    color: #6b7280;
    font-size: 13px;
    margin-top: 3px;
}

.account-field {
    margin-bottom: 18px;
}

.account-field label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
}

.account-field input {
    width: 100%;
    height: 54px;
    padding: 0 16px;
    border: 1px solid #dfe4ea;
    border-radius: 13px;
    font-family: inherit;
    font-size: 16px;
    outline: none;
    background: white;
}

.account-field input:focus {
    border-color: #1769aa;
    box-shadow: 0 0 0 3px rgba(23,105,170,.10);
}

.account-field input:disabled {
    background: #f5f7fa;
    color: #6b7280;
}

.account-field small {
    display: block;
    color: #9ca3af;
    margin-top: 5px;
    font-size: 12px;
}

.account-save {
    width: 100%;
    height: 54px;
    border: 0;
    border-radius: 13px;
    background: #1769aa;
    color: white;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.account-save:hover {
    background: #12598f;
}

.account-success {
    background: #ecfdf3;
    color: #166534;
    border: 1px solid #bbf7d0;
    padding: 14px 16px;
    border-radius: 13px;
    margin-bottom: 18px;
}

@media (max-width: 600px) {

    .account-page {
        margin: 8px auto 35px;
    }

    .account-header {
        padding: 22px 18px;
        border-radius: 17px;
    }

    .account-header h1 {
        font-size: 24px;
    }

    .account-card {
        padding: 18px;
        border-radius: 17px;
    }
}

</style>

{% endblock %}
