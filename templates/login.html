{% extends "base.html" %}

{% block title %}تسجيل الدخول - بيوت العراق{% endblock %}

{% block content %}

<div class="form-card">

    <h1>تسجيل الدخول</h1>

    {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <div class="form-group">
            <label for="username">اسم المستخدم</label>
            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary">
            دخول
        </button>

    </form>

    <p style="margin-top:18px;">
        ليس لديك حساب؟
        <a href="/register" style="color:#1769aa;font-weight:bold;">
            إنشاء حساب
        </a>
    </p>

</div>

{% endblock %}
