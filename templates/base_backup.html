<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}بيوت العراق{% endblock %}</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background: #f6f8fb;
            color: #172033;
            line-height: 1.7;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(255,255,255,.96);

            border-bottom: 1px solid #e7ebf0;

            backdrop-filter: blur(12px);
        }

        .nav-container {
            width: 100%;
            max-width: 1180px;

            margin: auto;

            min-height: 72px;

            padding: 12px 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 24px;
        }

        .logo {
            display: inline-flex;
            align-items: center;

            white-space: nowrap;

            font-size: 23px;
            font-weight: 800;

            color: #1769aa;
        }

        .logo span {
            color: #f59e0b;
        }

        .nav-links {
            display: flex;
            align-items: center;

            gap: 6px;

            flex-wrap: wrap;
        }

        .nav-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 9px 12px;

            border-radius: 9px;

            color: #4b5563;

            font-size: 14px;
            font-weight: 600;

            transition:
                background .2s,
                color .2s;
        }

        .nav-links a:hover {
            background: #eef5fb;
            color: #1769aa;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 42px;

            padding: 9px 18px;

            border: 0;
            border-radius: 10px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background .2s,
                transform .15s;
        }

        .btn-primary {
            background: #1769aa;
            color: white !important;
        }

        .btn-primary:hover {
            background: #12598f;
        }

        .btn:active {
            transform: scale(.98);
        }

        .btn-light {
            background: #eef5fb;
            color: #1769aa;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .container {
            width: 100%;
            max-width: 1180px;

            margin: auto;

            padding: 30px 22px;
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #1769aa 0%,
                    #12598f 55%,
                    #0f4c75 100%
                );

            color: white;

            border-radius: 24px;

            padding: 48px 28px 38px;

            margin-bottom: 32px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(15,76,117,.16);
        }

        .hero h1 {
            font-size: 34px;
            font-weight: 800;

            margin-bottom: 8px;
        }

        .hero p {
            color: rgba(255,255,255,.88);

            font-size: 16px;

            margin-bottom: 26px;
        }


        /* =====================================================
           SEARCH BOX
        ===================================================== */

        .search-box {
            width: 100%;
            max-width: 880px;

            margin: auto;

            padding: 22px;

            background: white;

            border-radius: 18px;

            text-align: right;

            box-shadow:
                0 12px 35px rgba(0,0,0,.12);

            display: flex;
            flex-direction: column;

            gap: 15px;
        }

        .search-field {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 6px;
        }

        .search-field label {
            color: #374151;

            font-size: 13px;
            font-weight: 700;
        }

        .search-box input,
        .search-box select {
            width: 100%;

            height: 50px;

            padding: 0 15px;

            margin: 0;

            border: 1px solid #dce2e9;

            border-radius: 11px;

            background: #fff;

            color: #172033;

            font-size: 15px;

            outline: none;

            transition:
                border-color .2s,
                box-shadow .2s;
        }

        .search-box input::placeholder {
            color: #9ca3af;
        }

        .search-box input:focus,
        .search-box select:focus {
            border-color: #1769aa;

            box-shadow:
                0 0 0 3px rgba(23,105,170,.10);
        }

        .price-fields {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .search-submit {
            width: 100%;

            height: 50px;

            border: 0;

            border-radius: 11px;

            background: #1769aa;

            color: white;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            transition:
                background .2s,
                transform .15s;
        }

        .search-submit:hover {
            background: #12598f;
        }

        .search-submit:active {
            transform: scale(.99);
        }


        /* =====================================================
           SECTION TITLES
        ===================================================== */

        .section-title {
            margin: 34px 0 18px;

            font-size: 24px;

            font-weight: 800;

            color: #172033;
        }


        /* =====================================================
           PROPERTY GRID
        ===================================================== */

        .houses-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(270px, 1fr)
                );

            gap: 22px;
        }


        /* =====================================================
           PROPERTY CARD
        ===================================================== */

        .house-card {
            overflow: hidden;

            background: white;

            border: 1px solid #edf0f4;

            border-radius: 18px;

            box-shadow:
                0 7px 25px rgba(15,23,42,.06);

            transition:
                transform .2s,
                box-shadow .2s;
        }

        .house-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 14px 35px rgba(15,23,42,.10);
        }

        .house-image {
            position: relative;

            height: 210px;

            background: #e9eef4;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .house-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            transition: transform .3s;
        }

        .house-card:hover .house-image img {
            transform: scale(1.03);
        }

        .house-content {
            padding: 18px;
        }

        .house-title {
            font-size: 18px;

            font-weight: 800;

            margin-bottom: 7px;

            color: #172033;
        }

        .location {
            color: #6b7280;

            font-size: 14px;
        }

        .price {
            color: #1769aa;

            font-size: 18px;

            font-weight: 800;

            margin: 11px 0;
        }

        .owner {
            color: #6b7280;

            font-size: 13px;
        }


        /* =====================================================
           FORMS
        ===================================================== */

        .form-card {
            width: 100%;
            max-width: 650px;

            margin: 20px auto;

            background: white;

            padding: 28px;

            border-radius: 18px;

            border: 1px solid #edf0f4;

            box-shadow:
                0 8px 28px rgba(15,23,42,.06);
        }

        .form-card h1 {
            margin-bottom: 20px;

            font-size: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #374151;

            font-size: 14px;
            font-weight: 700;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #dce2e9;

            border-radius: 11px;

            outline: none;

            background: white;

            font-size: 15px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #1769aa;

            box-shadow:
                0 0 0 3px rgba(23,105,170,.08);
        }

        .form-group textarea {
            min-height: 130px;

            resize: vertical;
        }


        /* =====================================================
           ALERTS
        ===================================================== */

        .alert {
            padding: 13px 15px;

            border-radius: 10px;

            margin-bottom: 15px;
        }

        .alert-error {
            background: #fee2e2;

            color: #991b1b;
        }

        .alert-success {
            background: #dcfce7;

            color: #166534;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            margin-top: 55px;

            padding: 35px 20px;

            text-align: center;

            background: #172033;

            color: #cbd5e1;
        }

        footer p:first-child {
            color: white;

            font-weight: 800;

            margin-bottom: 5px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .nav-container {
                min-height: auto;

                padding: 10px 12px;

                flex-direction: column;

                gap: 8px;
            }

            .logo {
                width: 100%;

                justify-content: center;

                font-size: 21px;
            }

            .nav-links {
                width: 100%;

                justify-content: center;

                gap: 3px;
            }

            .nav-links a {
                padding: 7px 8px;

                font-size: 12px;
            }

            .container {
                padding: 18px 12px;
            }

            .hero {
                padding: 32px 12px 20px;

                border-radius: 18px;

                margin-bottom: 22px;
            }

            .hero h1 {
                font-size: 27px;

                line-height: 1.4;
            }

            .hero p {
                font-size: 14px;

                margin-bottom: 20px;
            }

            .search-box {
                padding: 16px;

                border-radius: 15px;

                gap: 13px;
            }

            .price-fields {
                grid-template-columns: 1fr;

                gap: 13px;
            }

            .search-box input,
            .search-box select,
            .search-submit {
                height: 52px;

                font-size: 15px;
            }

            .houses-grid {
                grid-template-columns: 1fr;

                gap: 16px;
            }

            .house-image {
                height: 220px;
            }

            .section-title {
                font-size: 21px;

                margin: 26px 0 14px;
            }

            .form-card {
                margin: 10px auto;

                padding: 20px 16px;

                border-radius: 15px;
            }
        }


        /* =====================================================
           VERY SMALL PHONES
        ===================================================== */

        @media (max-width: 390px) {

            .nav-links a {
                font-size: 11px;

                padding: 6px 5px;
            }

            .logo {
                font-size: 19px;
            }

            .hero h1 {
                font-size: 24px;
            }

            .search-box {
                padding: 13px;
            }
        }

    
/* =====================================================
   FINAL MOBILE HOMEPAGE REDESIGN
   ===================================================== */

@media (max-width: 700px) {

    body {
        background: #f6f8fb;
    }

    /* NAVBAR */

    .navbar {
        position: sticky;
        top: 0;
    }

    .nav-container {
        min-height: auto;
        padding: 9px 12px 8px;
        gap: 5px;
    }

    .logo {
        width: 100%;
        justify-content: center;
        font-size: 20px;
        line-height: 1.3;
    }

    .nav-links {
        width: 100%;
        justify-content: center;
        gap: 2px;
    }

    .nav-links a {
        min-height: 34px;
        padding: 5px 7px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
    }

    /* MAIN */

    .container {
        padding: 14px 10px 25px;
    }

    /* HERO */

    .hero {
        margin-bottom: 20px;
        padding: 27px 10px 15px;
        border-radius: 19px;
        box-shadow: 0 10px 28px rgba(15,76,117,.13);
    }

    .hero h1 {
        margin-bottom: 7px;
        font-size: 25px;
        line-height: 1.45;
    }

    .hero p {
        margin: 0 auto 17px;
        max-width: 330px;
        font-size: 13px;
        line-height: 1.8;
    }

    /* SEARCH */

    .search-box {
        max-width: 100%;
        padding: 15px;
        gap: 11px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0,0,0,.09);
    }

    .search-field {
        gap: 5px;
    }

    .search-field label {
        font-size: 12px;
        font-weight: 800;
    }

    .search-box input,
    .search-box select {
        height: 48px;
        padding: 0 13px;
        border-radius: 10px;
        font-size: 14px;
    }

    .price-fields {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
    }

    .search-submit {
        height: 49px;
        margin-top: 2px;
        border-radius: 10px;
        font-size: 15px;
    }

    /* SECTION */

    .section-title {
        margin: 22px 5px 12px;
        font-size: 21px;
        line-height: 1.4;
    }

    /* PROPERTY CARDS */

    .houses-grid {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .house-card {
        border-radius: 15px;
    }

    .house-image {
        height: 205px;
    }

    .house-content {
        padding: 15px;
    }

    .house-title {
        font-size: 17px;
    }

    .price {
        font-size: 17px;
        margin: 8px 0;
    }

    .location {
        font-size: 13px;
    }

    /* FOOTER */

    footer {
        margin-top: 35px;
        padding: 25px 15px;
        font-size: 13px;
    }
}


/* VERY SMALL PHONES */

@media (max-width: 390px) {

    .nav-links a {
        padding: 5px 5px;
        font-size: 11px;
    }

    .logo {
        font-size: 19px;
    }

    .hero {
        padding-top: 24px;
    }

    .hero h1 {
        font-size: 23px;
    }

    .hero p {
        font-size: 12px;
    }

    .search-box {
        padding: 13px;
    }

    .price-fields {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .section-title {
        font-size: 20px;
    }
}

</style>
</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="nav-container">

            <a href="/" class="logo">
                🏠 بيوت<span>العراق</span>
            </a>

            <div class="nav-links">

                <a href="/">
                    الرئيسية
                </a>

                {% if session.get("user_id") %}

                    <a href="/add-house">
                        إضافة بيت
                    </a>

                    <a href="/my-houses">
                        🏠 عقاراتي
                    </a>

                    <a href="/account">
                        👤 حسابي
                    </a>

                    <a href="/logout">
                        خروج
                    </a>

                {% else %}

                    <a href="/login">
                        دخول
                    </a>

                    <a href="/register"
                       class="btn btn-primary">
                        إنشاء حساب
                    </a>

                {% endif %}

            </div>

        </div>

    </nav>


    <!-- CONTENT -->

    <main class="container">

        {% block content %}
        {% endblock %}

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            🏠 بيوت العراق
        </p>

        <p>
            منصة تأجير العقارات
        </p>

    </footer>

</body>

</html>
